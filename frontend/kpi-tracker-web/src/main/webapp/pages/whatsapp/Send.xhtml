<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/pages/californiatemplate/template.xhtml">
 <ui:define name="title">Send WhatsApp Message</ui:define><ui:define name="viewname">WhatsApp / Send</ui:define><ui:define name="content"><h:form id="sendForm"><div class="card"><h2>Send WhatsApp message</h2><p:growl showDetail="true"/><div class="ui-g ui-fluid">
  <div class="ui-g-12"><p:outputLabel for="account" value="WhatsApp account"/><p:selectOneMenu id="account" value="#{whatsappWorkspace.connectionId}"><f:selectItems value="#{whatsappWorkspace.connections}" var="c" itemLabel="#{empty c.verifiedName ? c.displayPhoneNumber : c.verifiedName.concat(' — ').concat(c.displayPhoneNumber)}" itemValue="#{c.id}"/><p:ajax listener="#{whatsappWorkspace.changeConnection}" update="@form"/></p:selectOneMenu></div>
  <div class="ui-g-12"><p:outputLabel for="recipient" value="Recipient (international format)"/><p:inputText id="recipient" value="#{whatsappWorkspace.sendRequest.recipientNumber}" placeholder="2567..." required="true"/></div>
  <div class="ui-g-12"><p:outputLabel for="template" value="Approved template (leave empty for a 24-hour reply)"/><p:selectOneMenu id="template" value="#{whatsappWorkspace.sendRequest.templateId}"><f:selectItem itemLabel="Free-text reply" itemValue=""/><f:selectItems value="#{whatsappWorkspace.templates}" var="t" itemLabel="#{t.name.concat(' — ').concat(t.approvalStatus)}" itemValue="#{t.id}"/><p:ajax update="messageFields"/></p:selectOneMenu></div>
  <h:panelGroup id="messageFields" layout="block" styleClass="ui-g-12"><p:outputPanel rendered="#{empty whatsappWorkspace.sendRequest.templateId}"><p:outputLabel for="raw" value="Reply text"/><p:inputTextarea id="raw" rows="5" value="#{whatsappWorkspace.sendRequest.rawBody}"/></p:outputPanel><p:outputPanel rendered="#{not empty whatsappWorkspace.sendRequest.templateId}"><p:outputLabel for="vars" value="Body variables (one value per line)"/><p:inputTextarea id="vars" rows="4" value="#{whatsappWorkspace.sendVariables}"/><p:outputLabel for="media" value="Header media ID (media templates only)"/><p:inputText id="media" value="#{whatsappWorkspace.sendRequest.headerMediaId}"/><p:outputLabel for="buttonVars" value="Dynamic URL values (one per line)"/><p:inputTextarea id="buttonVars" rows="2" value="#{whatsappWorkspace.buttonVariables}"/></p:outputPanel></h:panelGroup>
  <div class="ui-g-12"><p:commandButton value="Send message" icon="pi pi-send" actionListener="#{whatsappWorkspace.send}" update="@form"/></div>
 </div></div></h:form></ui:define>
</ui:composition>
