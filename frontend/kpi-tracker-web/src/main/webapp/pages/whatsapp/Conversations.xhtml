<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/pages/californiatemplate/template.xhtml">
 <ui:define name="title">WhatsApp Conversations</ui:define><ui:define name="viewname">WhatsApp / Conversations</ui:define><ui:define name="content"><h:form id="conversationForm"><p:growl showDetail="true"/><div class="card"><div class="ui-g ui-fluid"><div class="ui-g-12 ui-md-9"><p:selectOneMenu value="#{whatsappWorkspace.connectionId}"><f:selectItems value="#{whatsappWorkspace.connections}" var="c" itemLabel="#{empty c.verifiedName ? c.displayPhoneNumber : c.verifiedName.concat(' — ').concat(c.displayPhoneNumber)}" itemValue="#{c.id}"/><p:ajax listener="#{whatsappWorkspace.changeConnection}" update="@form"/></p:selectOneMenu></div><div class="ui-g-12 ui-md-3"><p:commandButton value="Refresh" icon="pi pi-refresh" actionListener="#{whatsappWorkspace.refreshLocal}" update="@form"/></div></div></div>
 <div class="ui-g"><div class="ui-g-12 ui-md-4"><div class="card"><h3>Conversations</h3><p:dataList value="#{whatsappWorkspace.conversations}" var="c" emptyMessage="No inbound conversations yet"><p:commandLink actionListener="#{whatsappWorkspace.openConversation(c)}" process="@this" update=":conversationForm:thread"><div style="padding:.8rem 0"><strong>#{empty c.contactName ? c.contactNumber : c.contactName}</strong><br/><small>#{c.contactNumber} · <h:outputText value="#{c.lastActivityAt}"><f:convertDateTime pattern="dd MMM HH:mm"/></h:outputText></small></div></p:commandLink></p:dataList></div></div>
 <div class="ui-g-12 ui-md-8"><h:panelGroup id="thread" layout="block"><div class="card"><h3>#{empty whatsappWorkspace.selectedConversation ? 'Select a conversation' : whatsappWorkspace.selectedConversation.contactNumber}</h3><p:commandButton value="Refresh thread" icon="pi pi-refresh" actionListener="#{whatsappWorkspace.refreshConversation}" process="@this" update=":conversationForm:thread" rendered="#{not empty whatsappWorkspace.selectedConversation}"/><ui:repeat value="#{whatsappWorkspace.messages}" var="m"><div style="display:flex;justify-content:#{m.direction eq 'OUTBOUND' ? 'flex-end' : 'flex-start'};margin:.75rem 0"><div style="max-width:75%;padding:.75rem 1rem;border-radius:9px;background:#{m.direction eq 'OUTBOUND' ? '#d9fdd3' : '#f1f1f1'}"><h:outputText value="#{m.body}" style="white-space:pre-wrap"/><br/><small><h:outputText value="#{m.sentAt}"><f:convertDateTime pattern="dd MMM HH:mm"/></h:outputText> · #{m.messageStatus}</small><h:panelGroup rendered="#{not empty m.statusDetails}"><br/><small style="color:#b42318"><h:outputText value="#{m.statusDetails}"/></small></h:panelGroup></div></div></ui:repeat><p:outputPanel rendered="#{not empty whatsappWorkspace.selectedConversation}" style="margin-top:1rem"><p:inputTextarea value="#{whatsappWorkspace.replyBody}" rows="3" style="width:100%" placeholder="Reply within the 24-hour customer service window"/><p:commandButton value="Reply" icon="pi pi-send" actionListener="#{whatsappWorkspace.reply}" update=":conversationForm:thread" disabled="#{not whatsappWorkspace.selectedConversation.windowOpen}"/><h:outputText value="  The 24-hour reply window is closed; use an approved template." rendered="#{not whatsappWorkspace.selectedConversation.windowOpen}" style="color:#b44"/></p:outputPanel></div></h:panelGroup></div></div>
 </h:form></ui:define>
</ui:composition>
