<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui">

<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
    </f:facet>
    <title>Something went wrong | egoSms</title>
</h:head>

<h:body styleClass="exception-body">

    <div class="exception-topbar">
        <h:link outcome="/pages/whatsapp/ConnectedAccounts.xhtml" styleClass="logo egosms-wordmark">
            <span class="egosms-wordmark-ego">ego</span><span class="egosms-wordmark-sms">Sms</span>
        </h:link>
    </div>
            
    <p:graphicImage styleClass="exception-image" name="images/image-error.png" library="california-layout" />
            
    <div class="exception-panel">
        <p:graphicImage styleClass="exception-icon" name="images/icon-error.png" library="california-layout" />
        <h1 class="exception-summary">Something went wrong</h1>
        <p class="exception-detail">
            An error occurred. Please try again later.<br></br>
            Return to the WhatsApp Center to continue.
        </p>
        <div>
            <p:button outcome="/pages/whatsapp/ConnectedAccounts.xhtml" value="Go to WhatsApp Center" />
        </div>
    </div>
    <h:outputStylesheet name="css/layout-#{guestPreferences.theme}.css" library="california-layout" />
    <h:outputStylesheet name="css/egosms-brand.css" library="egosms" />
</h:body>

</html>
