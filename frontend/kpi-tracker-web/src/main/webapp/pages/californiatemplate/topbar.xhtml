<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:po="http://primefaces.org/california">

    <div class="layout-topbar">
        <h:link outcome="/pages/whatsapp/ConnectedAccounts" styleClass="logo egosms-wordmark egosms-topbar-brand">
            <span class="egosms-wordmark-ego">ego</span><span class="egosms-wordmark-sms">Sms</span>
        </h:link>

        <a id="menu-button" href="#">
            <i class="pi pi-align-left"/>
        </a>

        <span class="egosms-product-name">WhatsApp Center</span>
        <h:form id="topbarProfileForm">
            <ui:fragment rendered="#{guestPreferences.profileMode == 'topbar' ? true : false}">
                <a id="topbar-menu-button" href="#">
                    <span class="egosms-user-avatar"><i class="pi pi-user"/></span>
                    <span>#{dashboard.loggedinUser.emailAddress}</span>
                </a>

                <ul id="topbar-usermenu" class="usermenu usermenu-overlay">
                    <li><a href="#{request.contextPath}/ServiceLogout"><i class="pi pi-fw pi-sign-out"/><span class="topbar-item-name">Sign out</span></a></li>
                </ul>
            </ui:fragment>
        </h:form>
    </div>

</ui:composition>
